<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot v4 🎰</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #1b2735, #090a0f);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* 主容器 */
.slot-container {
    width: 360px;
    padding: 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0,255,255,0.2);
    text-align: center;
}

/* 标题 */
h1 {
    margin: 10px 0 20px;
    font-size: 22px;
    color: #00ffe1;
}

/* 老虎机 */
.reels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.reel {
    width: 90px;
    height: 90px;
    background: #111;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    box-shadow: inset 0 0 10px rgba(0,255,255,0.3);
    transition: transform 0.2s;
}

/* 按钮 */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #00ffe1, #0077ff);
    color: #000;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* 中奖闪烁 */
.win {
    animation: glow 0.3s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 10px #00ffe1; }
    to { box-shadow: 0 0 25px #00ffe1; }
}

#result {
    margin-top: 15px;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="slot-container">
    <h1>🎰 Slot v4</h1>

    <div class="reels">
        <div class="reel" id="r1">🍒</div>
        <div class="reel" id="r2">🍋</div>
        <div class="reel" id="r3">🍊</div>
    </div>

    <button onclick="spin()">SPIN</button>

    <div id="result">点击开始游戏</div>
</div>

<script>
// ===== 图标池 =====
const symbols = ["🍒","🍋","🍊","🍉","⭐","🔔"];

// ===== 音效 =====
const ctx = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq, time){
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = freq;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + time);
    o.stop(ctx.currentTime + time);
}

// ===== 老虎机逻辑 =====
let spinning = false;

function randSymbol(){
    return symbols[Math.floor(Math.random() * symbols.length)];
}

function spin(){
    if(spinning) return;
    spinning = true;

    const r1 = document.getElementById("r1");
    const r2 = document.getElementById("r2");
    const r3 = document.getElementById("r3");
    const result = document.getElementById("result");

    result.innerText = "🎲 转动中...";

    let count = 0;
    const interval = setInterval(() => {
        r1.innerText = randSymbol();
        r2.innerText = randSymbol();
        r3.innerText = randSymbol();
        beep(200 + Math.random()*300, 0.05);
        count++;
        if(count > 15){
            clearInterval(interval);
            finishSpin();
        }
    }, 80);

    function finishSpin(){
        const a = randSymbol();
        const b = randSymbol();
        const c = randSymbol();

        r1.innerText = a;
        r2.innerText = b;
        r3.innerText = c;

        let win = (a === b && b === c);

        if(win){
            result.innerText = "🎉 JACKPOT!";
            beep(800, 0.2);
            setTimeout(()=>beep(1000,0.3),150);
            setTimeout(()=>beep(1200,0.4),300);

            r1.classList.add("win");
            r2.classList.add("win");
            r3.classList.add("win");

            setTimeout(()=>{
                r1.classList.remove("win");
                r2.classList.remove("win");
                r3.classList.remove("win");
            },1500);

        } else {
            result.innerText = "再试一次 💨";
            beep(120, 0.2);
        }

        spinning = false;
    }
}
</script>

</body>
</html>
