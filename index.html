<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUANT LABS - V6.0 Elite</title>
    <style>
        :root { --bg: #050505; --gold: #ffd700; --neon: #ff003c; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Arial Black', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .cabinet { width: 90%; max-width: 450px; background: linear-gradient(180deg, #2a0000 0%, #000 100%); border: 8px solid #333; border-radius: 25px; padding: 20px; box-shadow: 0 0 50px rgba(255,0,0,0.3); position: relative; }
        
        .reels-container { display: flex; gap: 5px; background: #000; border: 4px solid var(--gold); padding: 10px; border-radius: 10px; height: 110px; }
        .slot { flex: 1; display: flex; justify-content: center; align-items: center; font-size: 2.8rem; text-shadow: 0 0 15px var(--gold); transition: all 0.1s; }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translate(0); } 25% { transform: translate(-10px, 5px); } 75% { transform: translate(10px, -5px); } }
        
        .led-panel { background: #000; color: #0f0; padding: 15px; margin: 20px 0; border-radius: 10px; text-align: center; border: 2px solid #222; font-family: monospace; }
        
        .spin-btn { width: 100%; padding: 20px; background: radial-gradient(circle, #ff453a, #990000); border: none; color: #fff; font-size: 1.8rem; font-weight: 900; border-radius: 15px; cursor: pointer; text-shadow: 2px 2px #000; }
        
        .hidden-controls { display: flex; gap: 10px; margin-top: 15px; }
        .h-btn { font-size: 0.6rem; color: #444; cursor: pointer; }
    </style>
</head>
<body>

<div class="cabinet" id="cabinet">
    <div class="reels-container" id="reels">
        <div class="slot">7</div><div class="slot">7</div><div class="slot">7</div><div class="slot">7</div><div class="slot">7</div>
    </div>
    <div class="led-panel" id="led">SYSTEM READY | 5-REEL MODE</div>
    <button class="spin-btn" onclick="spin()">拉动摇杆</button>
    
    <div class="hidden-controls">
        <div class="h-btn" onclick="seq(1)">[C]</div>
        <div class="h-btn" onclick="seq(2)">[I]</div>
        <div class="h-btn" onclick="seq(3)">[R]</div>
    </div>
</div>

<script>
    const syms = ['7', '💎', '🍒', '🍋', '🔔', '🍇', '🍉'];
    let _seq = [], _jackpot = false;

    function seq(n) {
        _seq = [..._seq.slice(-2), n];
        if (_seq.join(',') === '1,2,3') {
            _jackpot = true;
            document.getElementById('led').innerText = "!! TARGET ACQUIRED !!";
            document.getElementById('led').style.color = "#ff0";
        }
    }

    function spin() {
        const slots = document.querySelectorAll('.slot');
        const cabinet = document.getElementById('cabinet');
        
        // 视觉转动模拟
        slots.forEach(s => s.style.opacity = 0.2);
        
        setTimeout(() => {
            const res = _jackpot ? Array(5).fill('7') : Array(5).fill(0).map(() => syms[Math.floor(Math.random()*syms.length)]);
            slots.forEach((s, i) => {
                s.innerText = res[i];
                s.style.opacity = 1;
            });
            
            if (_jackpot) {
                cabinet.classList.add('shake');
                document.getElementById('led').innerText = "★ JACKPOT 77777 ★";
                setTimeout(() => cabinet.classList.remove('shake'), 500);
            } else {
                document.getElementById('led').innerText = "结算完成，请继续";
            }
            _jackpot = false;
        }, 300);
    }
</script>
</body>
</html>
