<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUANT LABS - 4.0 Alpha Terminal</title>
    <style>
        :root {
            --term-bg: #030303;
            --term-green: #00ff41;
            --term-red: #ff3333;
            --term-blue: #00f0ff;
            --term-gold: #ffd700;
            --panel-bg: #0a0a0c;
            --grid-line: rgba(0, 255, 65, 0.15);
        }

        body {
            margin: 0; padding: 0; background-color: var(--term-bg); color: var(--term-green);
            font-family: "Courier New", Courier, monospace; /* 纯正代码字体 */
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 30px; user-select: none;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .header { width: 100%; max-width: 440px; padding: 20px 15px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-bottom: 1px solid var(--term-green); margin-bottom: 20px;}
        .brand { font-size: 1.2rem; font-weight: bold; text-shadow: 0 0 5px var(--term-green); }
        .portfolio { border: 1px solid var(--term-green); padding: 5px 15px; font-weight: bold; background: rgba(0,255,65,0.05); }

        .terminal-core {
            width: 92%; max-width: 410px; background: var(--panel-bg);
            border: 2px solid #333; border-radius: 4px; padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,255,65,0.05);
            box-sizing: border-box; position: relative;
        }

        .status-bar { text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; border-bottom: 1px dashed #333; padding-bottom: 10px; color: var(--term-blue); }

        /* 数据视窗 */
        .matrix-viewport {
            display: flex; justify-content: space-between; background: #000;
            border: 1px solid var(--term-green); padding: 10px; height: 120px; position: relative;
            box-shadow: inset 0 0 15px rgba(0, 255, 65, 0.1);
        }
        .matrix-viewport::after { content: ""; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: rgba(0, 255, 65, 0.4); pointer-events: none; }
        
        .reel-col { width: 30%; height: 100%; position: relative; overflow: hidden; border-left: 1px dashed #222; border-right: 1px dashed #222; }
        .strip { position: absolute; top: 0; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; will-change: top; }
        .symbol { height: 120px; font-size: 3.5rem; display: flex; justify-content: center; align-items: center; }

        .log-screen { background: #000; border: 1px solid #333; padding: 10px; margin-top: 15px; font-size: 0.9rem; min-height: 40px; display: flex; align-items: center; justify-content: center; text-align: center; }

        /* 控制区 */
        .controls { margin-top: 20px; }
        .leverage-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 5px; }
        .btn { background: #000; border: 1px solid #444; color: #888; padding: 8px 15px; font-family: "Courier New"; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .btn.active { border-color: var(--term-green); color: var(--term-green); background: rgba(0,255,65,0.1); box-shadow: 0 0 8px rgba(0,255,65,0.3); }
        
        .exec-btn { width: 100%; background: #000; border: 2px solid var(--term-blue); color: var(--term-blue); padding: 15px; font-size: 1.2rem; font-weight: bold; font-family: "Courier New"; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .exec-btn:hover:not(:disabled) { background: rgba(0, 240, 255, 0.1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        .exec-btn:disabled { border-color: #333; color: #555; cursor: not-allowed; }

        /* 量化监控面板 */
        .monitor-panel { width: 92%; max-width: 410px; border: 1px solid #333; margin-top: 20px; padding: 15px; box-sizing: border-box; background: var(--panel-bg); }
        .monitor-title { font-size: 0.85rem; color: #666; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .data-cell { display: flex; flex-direction: column; }
        .data-lbl { font-size: 0.75rem; color: #888; }
        .data-val { font-size: 1.2rem; font-weight: bold; }
        
        /* 隐藏功能触发区 */
        #trigger-zone { cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">QUANT_LABS // v4.0</div>
        <div class="portfolio">PORTFOLIO: $<span id="ui-balance">1000</span></div>
    </div>

    <div class="terminal-core">
        <div class="status-bar" id="ui-status">SYNERGY MONITOR ACTIVE</div>
        
        <div class="matrix-viewport">
            <div class="reel-col"><div class="strip" id="reel-0"></div></div>
            <div class="reel-col"><div class="strip" id="reel-1"></div></div>
            <div class="reel-col"><div class="strip" id="reel-2"></div></div>
        </div>

        <div class="log-screen" id="ui-log">> System initialized. Awaiting execution.</div>

        <div class="controls">
            <div class="leverage-row">
                <span style="color:#888; font-size: 0.9rem;">LEVERAGE (SIZE)</span>
                <div class="btn-group">
                    <button class="btn active" data-val="10">x10</button>
                    <button class="btn" data-val="50">x50</button>
                    <button class="btn" data-val="100">x100</button>
                </div>
            </div>
            <button class="exec-btn" id="ui-spin">EXECUTE_TRADE()</button>
        </div>
    </div>

    <div class="monitor-panel">
        <div class="monitor-title">ALGO PERFORMANCE METRICS</div>
        <div class="data-grid">
            <div class="data-cell"><span class="data-lbl">ITERATIONS</span><span class="data-val" id="ui-rounds" style="color:var(--term-blue);">0</span></div>
            <div class="data-cell" id="trigger-zone"><span class="data-lbl">WIN_RATE (ALPHA)</span><span class="data-val" id="ui-rate" style="color:var(--term-gold);">0.00%</span></div>
            <div class="data-cell"><span class="data-lbl">CAPITAL_DEPLOYED</span><span class="data-val" id="ui-spent" style="color:var(--term-red);">0</span></div>
            <div class="data-cell"><span class="data-lbl">TOTAL_RETURN</span><span class="data-val" id="ui-return" style="color:var(--term-green);">0</span></div>
        </div>
    </div>

    <script>
        // OOP架构重构
        class QuantSlotMachine {
            constructor() {
                // 主题符号：核、光伏、储能、趋势、模型、钻石、7
                this.symbols = ['⚛️', '☀️', '🔋', '📈', '📊', '💎', '7'];
                this.symbolHeight = 120;
                
                this.state = {
                    balance: 1000,
                    leverage: 10,
                    isRunning: false,
                    stats: { spent: 0, returned: 0, rounds: 0, wins: 0 },
                    resonanceOverride: false,
                    stealthClicks: 0
                };

                this.dom = {
                    balance: document.getElementById('ui-balance'),
                    status: document.getElementById('ui-status'),
                    log: document.getElementById('ui-log'),
                    spinBtn: document.getElementById('ui-spin'),
                    reels: [document.getElementById('reel-0'), document.getElementById('reel-1'), document.getElementById('reel-2')],
                    stats: {
                        rounds: document.getElementById('ui-rounds'),
                        rate: document.getElementById('ui-rate'),
                        spent: document.getElementById('ui-spent'),
                        return: document.getElementById('ui-return')
                    }
                };

                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.initReels();
                this.bindEvents();
            }

            beep(freq, type = 'square', duration = 0.05, vol = 0.05) {
                try {
                    if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    osc.type = type; osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
                    gain.gain.setValueAtTime(vol, this.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.audioCtx.destination);
                    osc.start(); osc.stop(this.audioCtx.currentTime + duration);
                } catch(e) {}
            }

            initReels() {
                this.dom.reels.forEach(reel => {
                    reel.innerHTML = '';
                    for (let i = 0; i < 40; i++) {
                        const div = document.createElement('div');
                        div.className = 'symbol';
                        div.innerText = this.symbols[i % this.symbols.length];
                        reel.appendChild(div);
                    }
                });
            }

            bindEvents() {
                document.querySelectorAll('.btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        if (this.state.isRunning) return;
                        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.state.leverage = parseInt(e.target.dataset.val);
                        this.beep(800, 'sine');
                    });
                });

                this.dom.spinBtn.addEventListener('click', () => this.executeSpin());

                // 跨市场信号共振暗门
                document.getElementById('trigger-zone').addEventListener('click', () => {
                    if(this.state.isRunning) return;
                    this.state.stealthClicks++;
                    this.beep(1200 + (this.state.stealthClicks * 100), 'sine', 0.05);
                    if (this.state.stealthClicks >= 5) {
                        this.state.stealthClicks = 0;
                        this.state.resonanceOverride = true;
                        this.updateLog("> WARNING: CROSS-MARKET SIGNAL RESONANCE DETECTED.", "var(--term-gold)");
                        this.beep(400, 'sawtooth', 0.3, 0.1);
                    }
                });
            }

            updateLog(msg, color = "var(--term-green)") {
                this.dom.log.innerText = msg;
                this.dom.log.style.color = color;
            }

            updateStats() {
                this.dom.balance.innerText = this.state.balance;
                this.dom.stats.rounds.innerText = this.state.stats.rounds;
                this.dom.stats.spent.innerText = this.state.stats.spent;
                this.dom.stats.return.innerText = this.state.stats.returned;
                const rate = this.state.stats.rounds === 0 ? 0 : (this.state.stats.wins / this.state.stats.rounds) * 100;
                this.dom.stats.rate.innerText = rate.toFixed(2) + '%';
            }

            rollReel(index, targetSymbol, duration) {
                return new Promise(resolve => {
                    const el = this.dom.reels[index];
                    const targetIdx = this.symbols.indexOf(targetSymbol) + (this.symbols.length * 4);
                    
                    el.style.transition = `top ${duration}s cubic-bezier(0.1, 0.8, 0.2, 1)`;
                    el.style.top = `-${targetIdx * this.symbolHeight}px`;

                    let tick = setInterval(() => this.beep(200 + (index * 50), 'triangle', 0.02, 0.02), 80);

                    setTimeout(() => {
                        clearInterval(tick);
                        this.beep(600, 'square', 0.05, 0.05);
                        resolve();
                    }, duration * 1000);
                });
            }

            async executeSpin() {
                if (this.state.balance < this.state.leverage) {
                    this.updateLog("> ERROR: INSUFFICIENT CAPITAL.", "var(--term-red)");
                    return;
                }

                this.state.isRunning = true;
                this.dom.spinBtn.disabled = true;
                this.state.balance -= this.state.leverage;
                this.state.stats.spent += this.state.leverage;
                this.state.stats.rounds++;
                
                this.updateStats();
                this.updateLog("> Executing model...", "var(--term-blue)");
                this.dom.status.innerText = "CALCULATING PROBABILITIES...";

                let results;
                if (this.state.resonanceOverride) {
                    results = ['7', '7', '7'];
                    this.state.resonanceOverride = false;
                } else {
                    results = [0,1,2].map(() => this.symbols[Math.floor(Math.random() * this.symbols.length)]);
                }

                await Promise.all([
                    this.rollReel(0, results[0], 1.2),
                    this.rollReel(1, results[1], 1.6),
                    this.rollReel(2, results[2], 2.0)
                ]);

                this.evaluateResults(results);
            }

            evaluateResults(arr) {
                const [v1, v2, v3] = arr;
                let multiplier = 0;
                let msg = "";
                let color = "var(--term-green)";

                if (v1 === v2 && v2 === v3) {
                    this.state.stats.wins++;
                    if (v1 === '7') { 
                        multiplier = 80; msg = "> 🌋 跨市场信号共振！捕获 777 绝对 Alpha！"; color = "var(--term-gold)"; 
                    } else if (v1 === '💎') { 
                        multiplier = 40; msg = "> 💎 突破阻力位！核心资产价值发现！"; 
                    } else { 
                        multiplier = 20; msg = `> 🎉 模型收敛！[${v1}] 产业链景气度爆发！`; 
                    }
                } else if (v1 === v2 || v2 === v3 || v1 === v3) {
                    this.state.stats.wins++; multiplier = 2.5; msg = "> ✨ 局部资金异动，产生结构性行情。"; color = "var(--term-blue)";
                } else {
                    msg = "> ⚡️ 均值回归，无明显超额收益。"; color = "var(--term-red)";
                }

                if (multiplier > 0) {
                    const profit = this.state.leverage * multiplier;
                    this.state.balance += profit;
                    this.state.stats.returned += profit;
                    this.updateLog(`${msg} PnL: +$${profit}`, color);
                    this.dom.status.innerText = `PROFIT LOGGED: +$${profit}`;
                    
                    setTimeout(() => this.beep(800, 'square', 0.1), 0);
                    setTimeout(() => this.beep(1000, 'square', 0.1), 100);
                    setTimeout(() => this.beep(1200, 'square', 0.3), 200);
                } else {
                    this.updateLog(msg, color);
                    this.dom.status.innerText = "SYNERGY MONITOR ACTIVE";
                    this.beep(150, 'sawtooth', 0.2, 0.1);
                }

                this.updateStats();

                // 静默重置物理引擎位移
                setTimeout(() => {
                    [0,1,2].forEach(i => {
                        const el = this.dom.reels[i];
                        el.style.transition = 'none';
                        el.style.top = `-${this.symbols.indexOf(arr[i]) * this.symbolHeight}px`;
                    });
                    this.state.isRunning = false;
                    this.dom.spinBtn.disabled = false;
                }, 500);
            }
        }

        // 启动终端
        window.onload = () => {
            window.QuantTerminal = new QuantSlotMachine();
        };
    </script>
</body>
</html>
