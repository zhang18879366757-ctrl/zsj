<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUANT LABS - 10.0 Cluster Matrix</title>
    <style>
        :root { 
            --gold: #ffd700; --neon-blue: #00f3ff; 
            --neon-purple: #b500ff; --neon-green: #39ff14;
        }
        body { 
            margin: 0; background: radial-gradient(circle at 50% 0%, #1a0f2e 0%, #05020a 100%); 
            color: #fff; font-family: -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; padding: 15px; box-sizing: border-box; overflow: hidden; 
            user-select: none;
        }
        
        .dashboard { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 900; font-size: 1.1rem; }
        .score-pill { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); padding: 8px 18px; border-radius: 30px; color: var(--gold); border: 1px solid rgba(255, 215, 0, 0.4); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        
        .cabinet { 
            width: 100%; max-width: 420px; background: rgba(20, 10, 30, 0.8); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 15px; box-sizing: border-box; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 2px rgba(255,255,255,0.2); position: relative;
        }
        .shake { animation: cabinetShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes cabinetShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }
        
        .grid { 
            display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); 
            gap: 5px; background: rgba(0, 0, 0, 0.6); border-radius: 16px; padding: 6px; position: relative; 
            border: 2px solid rgba(181, 0, 255, 0.4);
        }
        
        .cell { 
            aspect-ratio: 1 / 1; background: linear-gradient(135deg, #2c1b4d, #120a21); 
            border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; 
            display: flex; justify-content: center; align-items: center; font-size: clamp(1.5rem, 6vw, 2.2rem); 
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.1);
        }
        
        .pop { transform: scale(0) rotate(90deg); opacity: 0; }
        .fall { animation: bounceDrop 0.4s cubic-bezier(0.28, 0.84, 0.42, 1) forwards; }
        @keyframes bounceDrop { 
            0% { transform: translateY(-80px) scaleY(1.2); opacity: 0; }
            70% { transform: translateY(5px) scaleY(0.9); opacity: 1; }
            100% { transform: translateY(0) scaleY(1); opacity: 1; }
        }

        .floating-text {
            position: absolute; color: var(--gold); font-weight: 900; font-size: 1.4rem;
            pointer-events: none; z-index: 100; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.8); opacity: 1; } 50% { transform: translateY(-30px) scale(1.2); opacity: 1; } 100% { transform: translateY(-50px) scale(1); opacity: 0; } }

        .led { background: #000; color: var(--neon-blue); padding: 12px; margin: 15px 0; border-radius: 10px; font-weight: 900; text-align: center; font-family: monospace; font-size: 1.1rem; border: 1px solid rgba(0, 243, 255, 0.3); text-shadow: 0 0 8px var(--neon-blue); }
        .spin-btn { width: 100%; padding: 18px; background: linear-gradient(90deg, #ff0055, #b500ff); border: none; color: #fff; border-radius: 14px; font-size: 1.4rem; font-weight: 900; cursor: pointer; box-shadow: 0 5px 15px rgba(181, 0, 255, 0.3); transition: 0.1s; }
        .spin-btn:active { transform: translateY(4px); box-shadow: 0 2px 5px rgba(181, 0, 255, 0.3); }
        .spin-btn:disabled { background: #333; color: #666; transform: none; box-shadow: none; }
        
        .debug-area { display: flex; justify-content: space-between; gap: 8px; width: 100%; max-width: 420px; margin-top: 20px; }
        .debug-btn { flex: 1; padding: 10px; text-align: center; border-radius: 8px; font-size: 0.75rem; color: rgba(255,255,255,0.2); border: 1px dashed rgba(255,255,255,0.1); cursor: pointer; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div style="color:var(--neon-blue);">CLUSTER 10.0</div>
        <div class="score-pill">CREDITS: $<span id="domScore">1000</span></div>
    </div>

    <div class="cabinet" id="cabinet">
        <div class="grid" id="grid"></div>
        <div class="led" id="led">🟢 SYSTEM ONLINE</div>
        <button class="spin-btn" id="spinBtn" onclick="startGame()">INITIATE SPIN</button>
    </div>

    <div class="debug-area">
        <div class="debug-btn" onclick="seq(1)">[ SYS ]</div>
        <div class="debug-btn" onclick="seq(2)">[ LOG ]</div>
        <div class="debug-btn" onclick="seq(3)">[ OVR ]</div>
    </div>

    <script>
        const symbols = ['💎', '🍎', '⭐', '🍀', '🔥', '🔮']; 
        const COLS = 6; const ROWS = 6;
        let board = []; let domCells = [];
        let currentScore = 1000; let targetScore = 1000;
        let isProcessing = false;

        let _seq = [], _jackpot = false;
        function seq(n) {
            _seq.push(n); if (_seq.length > 3) _seq.shift();
            if (_seq.join(',') === '1,2,3') {
                _jackpot = true;
                const led = document.getElementById('led');
                led.innerText = "⚠️ OMEGA CLUSTER DETECTED ⚠️";
                led.style.color = "var(--neon-purple)";
                document.getElementById('cabinet').classList.add('shake');
                setTimeout(() => document.getElementById('cabinet').classList.remove('shake'), 500);
            }
        }

        const delay = ms => new Promise(r => setTimeout(r, ms));

        function initGrid() {
            const gridEl = document.getElementById('grid'); gridEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                board[r] = []; domCells[r] = [];
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div'); cell.className = 'cell';
                    let sym = symbols[Math.floor(Math.random() * symbols.length)];
                    board[r][c] = sym; cell.innerText = sym;
                    domCells[r][c] = cell; gridEl.appendChild(cell);
                }
            }
        }

        function rollScoreTo(newScore) {
            const scoreEl = document.getElementById('domScore');
            const duration = 500; const startScore = currentScore;
            const diff = newScore - startScore; let startTime = null;

            function animation(currentTime) {
                if (startTime === null) startTime = currentTime;
                const progress = Math.min((currentTime - startTime) / duration, 1);
                currentScore = Math.floor(progress * diff + startScore);
                scoreEl.innerText = currentScore;
                if (progress < 1) requestAnimationFrame(animation);
                else currentScore = newScore;
            }
            requestAnimationFrame(animation);
        }

        function showFloatingText(r, c, text, color) {
            const cell = domCells[r][c]; const rect = cell.getBoundingClientRect();
            const gridRect = document.getElementById('grid').getBoundingClientRect();
            const floatEl = document.createElement('div');
            floatEl.className = 'floating-text'; floatEl.innerText = text;
            floatEl.style.color = color || 'var(--gold)';
            floatEl.style.left = `${rect.left - gridRect.left + 10}px`;
            floatEl.style.top = `${rect.top - gridRect.top}px`;
            document.getElementById('grid').appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 800);
        }

        async function startGame() {
            if (isProcessing) return;
            isProcessing = true; document.getElementById('spinBtn').disabled = true;
            
            targetScore -= 20; rollScoreTo(targetScore);
            document.getElementById('led').innerText = "🌀 RESTRUCTURING MATRIX...";

            for (let r = 0; r < ROWS; r++) { for (let c = 0; c < COLS; c++) domCells[r][c].classList.add('pop'); }
            await delay(250);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let sym = _jackpot ? '7' : symbols[Math.floor(Math.random() * symbols.length)];
                    board[r][c] = sym; domCells[r][c].innerText = sym;
                    domCells[r][c].classList.remove('pop');
                }
            }
            _jackpot = false; await delay(300);
            await processMatches(1);
        }

        // ==========================================
        // 核心升级：连通块 DFS (深度优先搜索) 算法
        // ==========================================
        async function processMatches(comboCount) {
            let matchedCoords = new Set();
            let visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!visited[r][c] && board[r][c] !== null) {
                        let sym = board[r][c];
                        let group = [];
                        let stack = [[r, c]];
                        visited[r][c] = true;

                        // 开始寻找周围所有的连通块
                        while (stack.length > 0) {
                            let [currR, currC] = stack.pop();
                            group.push(`${currR},${currC}`);

                            // 上下左右四个方向
                            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
                            for (let [dr, dc] of dirs) {
                                let nr = currR + dr; let nc = currC + dc;
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                                    if (!visited[nr][nc] && board[nr][nc] === sym) {
                                        visited[nr][nc] = true;
                                        stack.push([nr, nc]);
                                    }
                                }
                            }
                        }

                        // 如果连在一起的数量大于等于 3 个，就判定为消除
                        if (group.length >= 3) {
                            group.forEach(coord => matchedCoords.add(coord));
                        }
                    }
                }
            }

            if (matchedCoords.size === 0) {
                document.getElementById('spinBtn').disabled = false; isProcessing = false;
                if(comboCount === 1) document.getElementById('led').innerText = "✅ STANDBY";
                return;
            }

            // 震动反馈
            if(comboCount > 1 || matchedCoords.size >= 6) {
                const cab = document.getElementById('cabinet');
                cab.classList.remove('shake'); void cab.offsetWidth; cab.classList.add('shake');
            }

            let led = document.getElementById('led');
            led.innerText = `🔥 COMBO x${comboCount} : +${matchedCoords.size} BLOCKS!`;
            led.style.color = comboCount > 2 ? "var(--neon-green)" : "var(--gold)";
            
            // 连通消除奖励：连通的数量越多，得分呈指数增长
            let addedScore = matchedCoords.size * comboCount * 15;
            targetScore += addedScore; rollScoreTo(targetScore);

            let index = 0;
            matchedCoords.forEach(coord => {
                let [r, c] = coord.split(',').map(Number);
                domCells[r][c].classList.add('pop'); board[r][c] = null;
                // 优化悬浮字：只在部分区域弹出，防止画面太乱
                if(index % 4 === 0) {
                    showFloatingText(r, c, `+${comboCount * 15}`, comboCount > 2 ? 'var(--neon-green)' : 'var(--gold)');
                }
                index++;
            });
            await delay(350); 

            // 引力下落系统
            for (let c = 0; c < COLS; c++) {
                let emptySpaces = 0;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r][c] === null) { emptySpaces++; } 
                    else if (emptySpaces > 0) {
                        board[r + emptySpaces][c] = board[r][c]; board[r][c] = null;
                        domCells[r + emptySpaces][c].innerText = board[r + emptySpaces][c];
                        domCells[r + emptySpaces][c].classList.remove('pop');
                        domCells[r][c].classList.add('pop'); 
                    }
                }
            }
            await delay(200);

            // 顶部填充新块
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] === null) {
                        let newSym = symbols[Math.floor(Math.random() * symbols.length)];
                        board[r][c] = newSym; domCells[r][c].innerText = newSym;
                        domCells[r][c].classList.remove('pop'); domCells[r][c].classList.add('fall');
                    }
                }
            }
            await delay(400); 
            for (let r = 0; r < ROWS; r++) { for (let c = 0; c < COLS; c++) domCells[r][c].classList.remove('fall'); }

            await processMatches(comboCount + 1);
        }

        initGrid();
    </script>
</body>
</html>
