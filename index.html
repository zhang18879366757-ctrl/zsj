<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>SLOT V4 CASINO</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --gold:#ffd700;
    --gold2:#ffb300;
    --bg:#050505;
    --panel:#111;
    --green:#00ff88;
    --red:#ff3333;
}

body{
    background:
    radial-gradient(circle at top,#3b2500 0%,#111 30%,#000 100%);
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    sans-serif;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#coinsCanvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
}

.container{

    width:95%;
    max-width:460px;

    background:
    linear-gradient(
        180deg,
        #222,
        #090909
    );

    border:3px solid var(--gold);

    border-radius:28px;

    padding:20px;

    box-shadow:
    0 0 40px rgba(255,215,0,.25),
    inset 0 0 30px rgba(255,255,255,.05);
}

.title{
    text-align:center;
    font-size:34px;
    font-weight:900;
    color:var(--gold);
    text-shadow:
    0 0 15px var(--gold);
    margin-bottom:15px;
}

.top-panel{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;

    margin-bottom:15px;
}

.info-box{

    background:#111;

    border:2px solid #333;

    border-radius:16px;

    padding:12px;

    text-align:center;
}

.info-label{
    color:#999;
    font-size:12px;
}

.info-value{

    color:var(--gold);

    font-size:24px;

    font-weight:bold;

    margin-top:5px;
}

.jackpot{

    border-color:var(--gold);

    box-shadow:
    0 0 15px rgba(255,215,0,.25);
}

.reels{

    display:flex;

    gap:8px;

    background:#000;

    border:3px solid #444;

    border-radius:18px;

    padding:10px;

    margin-top:15px;

    margin-bottom:15px;

    overflow:hidden;
}

.reel{

    flex:1;

    height:120px;

    background:
    linear-gradient(
        180deg,
        #ffffff,
        #d9d9d9
    );

    color:#000;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:60px;

    border-radius:12px;

    border:2px solid #aaa;

    box-shadow:
    inset 0 8px 10px rgba(255,255,255,.8),
    inset 0 -8px 10px rgba(0,0,0,.15);
}

#led{

    min-height:60px;

    background:#020202;

    border:2px solid var(--green);

    border-radius:14px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    color:var(--green);

    font-weight:bold;

    font-size:18px;

    padding:10px;

    margin-bottom:15px;

    text-shadow:
    0 0 10px var(--green);

    box-shadow:
    inset 0 0 15px rgba(0,255,136,.15);
}

.bet-panel{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:8px;

    margin-bottom:12px;
}

.bet-btn{

    padding:12px;

    border:none;

    border-radius:12px;

    background:#222;

    color:#fff;

    cursor:pointer;
}

.bet-btn.active{

    background:var(--gold);

    color:#000;

    font-weight:bold;
}

.spin-btn{

    width:100%;

    padding:18px;

    border:none;

    border-radius:16px;

    font-size:24px;

    font-weight:900;

    color:#fff;

    background:
    linear-gradient(
        180deg,
        #ff4444,
        #c00000
    );

    box-shadow:
    0 0 20px rgba(255,0,0,.4);

    cursor:pointer;
}

.spin-btn:active{
    transform:scale(.98);
}

.stats{

    margin-top:15px;

    background:#111;

    border-radius:16px;

    padding:15px;

    border:1px solid #333;
}

.stats h3{

    color:var(--gold);

    margin-bottom:10px;

    text-align:center;
}

.stat-row{

    display:flex;

    justify-content:space-between;

    padding:5px 0;

    border-bottom:1px solid #222;
}

.win-flash{
    animation:flash .4s infinite;
}

@keyframes flash{

    50%{
        transform:scale(1.03);
        filter:brightness(1.3);
    }
}

@media(max-width:480px){

    .reel{
        height:100px;
        font-size:52px;
    }

    .title{
        font-size:28px;
    }
}

</style>
</head>

<body>

<canvas id="coinsCanvas"></canvas>

<div class="container">

<div class="title">
🎰 SLOT V4
</div>

<div class="top-panel">

<div class="info-box">
<div class="info-label">余额</div>
<div class="info-value" id="balance">
1000
</div>
</div>

<div class="info-box jackpot">
<div class="info-label">JACKPOT</div>
<div class="info-value" id="jackpot">
5000
</div>
</div>

</div>

<div class="reels" id="reels">

<div class="reel" id="r1">🍒</div>
<div class="reel" id="r2">💎</div>
<div class="reel" id="r3">🍇</div>

</div>

<div id="led">
准备开始
</div>

<div class="bet-panel">

<button class="bet-btn active" data-bet="10">
10
</button>

<button class="bet-btn" data-bet="50">
50
</button>

<button class="bet-btn" data-bet="100">
100
</button>

</div>

<button id="spinBtn" class="spin-btn">
SPIN
</button>

<div class="stats">

<h3>游戏统计</h3>

<div class="stat-row">
<span>总下注</span>
<span id="totalBet">0</span>
</div>

<div class="stat-row">
<span>总中奖</span>
<span id="totalWin">0</span>
</div>

<div class="stat-row">
<span>中奖次数</span>
<span id="winCount">0</span>
</div>

<div class="stat-row">
<span>RTP</span>
<span id="rtp">0%</span>
</div>

</div>

</div>

<script>

const SYMBOLS = [
“7”,
“💎”,
“🍒”,
“🍋”,
“🍇”,
“🍉”,
“🔔”
];

let balance = 1000;
let jackpot = 5000;
let currentBet = 10;

let totalBet = 0;
let totalWin = 0;
let winCount = 0;

let spinning = false;

const balanceEl = document.getElementById(“balance”);
const jackpotEl = document.getElementById(“jackpot”);

const totalBetEl = document.getElementById(“totalBet”);
const totalWinEl = document.getElementById(“totalWin”);
const winCountEl = document.getElementById(“winCount”);
const rtpEl = document.getElementById(“rtp”);

const led = document.getElementById(“led”);
const reels = document.getElementById(“reels”);
const spinBtn = document.getElementById(“spinBtn”);

loadData();
bindBetButtons();
updateUI();

function bindBetButtons(){

document
.querySelectorAll(".bet-btn")
.forEach(btn=>{
    btn.addEventListener("click",()=>{
        document
        .querySelectorAll(".bet-btn")
        .forEach(x=>x.classList.remove("active"));
        btn.classList.add("active");
        currentBet =
        Number(btn.dataset.bet);
    });
});

}

function randomSymbol(){

return SYMBOLS[
    Math.floor(
        Math.random() *
        SYMBOLS.length
    )
];

}

function updateUI(){

balanceEl.innerText = balance;
jackpotEl.innerText = jackpot;
totalBetEl.innerText = totalBet;
totalWinEl.innerText = totalWin;
winCountEl.innerText = winCount;
const rtp =
    totalBet > 0
    ? ((totalWin / totalBet) * 100).toFixed(2)
    : 0;
rtpEl.innerText = rtp + "%";

}

function saveData(){

const data = {
    balance,
    jackpot,
    totalBet,
    totalWin,
    winCount
};
localStorage.setItem(
    "slot_v4_save",
    JSON.stringify(data)
);

}

function loadData(){

const raw =
localStorage.getItem(
    "slot_v4_save"
);
if(!raw) return;
try{
    const data =
    JSON.parse(raw);
    balance =
    data.balance ?? 1000;
    jackpot =
    data.jackpot ?? 5000;
    totalBet =
    data.totalBet ?? 0;
    totalWin =
    data.totalWin ?? 0;
    winCount =
    data.winCount ?? 0;
}
catch(e){}

}

function animateReel(id,duration){

return new Promise(resolve=>{
    const reel =
    document.getElementById(id);
    const timer =
    setInterval(()=>{
        reel.innerText =
        randomSymbol();
    },60);
    setTimeout(()=>{
        clearInterval(timer);
        const result =
        randomSymbol();
        reel.innerText =
        result;
        resolve(result);
    },duration);
});

}

spinBtn.addEventListener(
“click”,
spin
);

async function spin(){

if(spinning) return;
if(balance < currentBet){
    led.innerText =
    "余额不足";
    return;
}
spinning = true;
spinBtn.disabled = true;
balance -= currentBet;
totalBet += currentBet;
jackpot += Math.floor(
    currentBet * 0.05
);
updateUI();
led.innerText =
"🎰 转动中...";
const a =
await animateReel(
    "r1",
    1000
);
const b =
await animateReel(
    "r2",
    1500
);
const c =
await animateReel(
    "r3",
    2000
);
settle(a,b,c);
saveData();
spinBtn.disabled = false;
spinning = false;

}

function settle(a,b,c){

reels.classList.remove(
    "win-flash"
);
let win = 0;
if(
    a==="7" &&
    b==="7" &&
    c==="7"
){
    win = jackpot;
    jackpot = 5000;
    led.innerText =
    "🌋 JACKPOT";
    reels.classList.add(
        "win-flash"
    );
}
else if(
    a===b &&
    b===c
){
    win =
    currentBet * 10;
    led.innerText =
    "🎉 三连中奖";
    reels.classList.add(
        "win-flash"
    );
}
else if(
    a===b ||
    b===c ||
    a===c
){
    win =
    currentBet * 2;
    led.innerText =
    "✨ 小奖";
}
else{
    led.innerText =
    "😢 未中奖";
}
if(win > 0){
    balance += win;
    totalWin += win;
    winCount++;
}
updateUI();

}

</script>

</body>
</html>
