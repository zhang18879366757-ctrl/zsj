<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLOT 3.4</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        .container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        
        /* 强制转盘布局，防止错位 */
        .reels { display: flex; justify-content: space-between; gap: 5px; background: #222; padding: 10px; border-radius: 10px; height: 100px; }
        .reel { flex: 1; background: #fff; color: #000; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 3rem; }
        
        /* 状态屏 */
        #led { background: #111; color: #0f0; padding: 15px; text-align: center; margin: 20px 0; border-radius: 5px; font-weight: bold; }
        
        /* 按钮布局 */
        .btn-spin { width: 100%; padding: 20px; background: #f00; border: none; color: #fff; font-size: 1.5rem; font-weight: bold; border-radius: 10px; }
        .debug-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .debug-btn { padding: 10px; background: #333; text-align: center; border-radius: 5px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="reels">
            <div class="reel" id="s1">🍒</div>
            <div class="reel" id="s2">💎</div>
            <div class="reel" id="s3">🍇</div>
        </div>
        <div id="led">🎯 待机中</div>
        <button class="btn-spin" onclick="spin()">SPIN</button>
        <div class="debug-grid">
            <div class="debug-btn" onclick="seq(1)">周期 [1]</div>
            <div class="debug-btn" onclick="seq(2)">投入 [2]</div>
            <div class="debug-btn" onclick="seq(3)">返还 [3]</div>
        </div>
    </div>

    <script>
        const symbols = ['7', '💎', '🍒', '🍋', '🔔', '🍇', '🍉'];
        let _seq = [], _jackpot = false;

        function seq(n) {
            _seq.push(n);
            if (_seq.length > 3) _seq.shift();
            if (_seq.join(',') === '1,2,3') {
                _jackpot = true;
                document.getElementById('led').innerText = "⚡️ 必中已激活";
                document.getElementById('led').style.color = "#ff0";
            }
        }

        function spin() {
            const res = _jackpot ? ['7', '7', '7'] : [0,1,2].map(() => symbols[Math.floor(Math.random()*symbols.length)]);
            ['s1', 's2', 's3'].forEach((id, i) => document.getElementById(id).innerText = res[i]);
            document.getElementById('led').innerText = _jackpot ? "🌋 777 大奖！" : "结算完毕";
            if(!_jackpot) document.getElementById('led').style.color = "#0f0";
            _jackpot = false;
        }
    </script>
</body>
</html>
