<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>豪华博弈模拟器 - 老虎机 2.0</title>
    <style>
        :root {
            --primary-color: #ff3b30;
            --gold-color: #ffcc00;
            --bg-dark: #121214;
            --card-bg: #1c1c1e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 顶部状态栏 */
        .header {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .balance-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .balance-container span {
            color: var(--gold-color);
        }

        /* 老虎机主车体 */
        .machine-container {
            width: 90%;
            max-width: 400px;
            background: linear-gradient(145deg, #2c0c0c, #1a0505);
            border: 6px solid #8b0000;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(255, 59, 48, 0.2);
            box-sizing: border-box;
            position: relative;
            margin-top: 10px;
        }

        /* 跑马灯特效 */
        .marquee {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--gold-color);
            text-shadow: 0 0 10px var(--gold-color);
            margin-bottom: 15px;
            letter-spacing: 2px;
            animation: blink 1s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 0.8; text-shadow: 0 0 5px var(--gold-color); }
            100% { opacity: 1; text-shadow: 0 0 20px #ff9500; }
        }

        /* 滚轮视窗 */
        .slots-window {
            display: flex;
            justify-content: space-between;
            background: #000000;
            border-radius: 12px;
            padding: 15px;
            border: 3px solid var(--gold-color);
            overflow: hidden;
            height: 120px;
        }

        .reel {
            width: 28%;
            height: 100%;
            background: #ffffff;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .reel-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: top 0s ease-in-out;
        }

        .slot-icon {
            height: 120px;
            font-size: 3.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* 控制区域 */
        .controls {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bet-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        .bet-btn {
            background: #2c2c2e;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .bet-btn.active {
            background: var(--gold-color);
            color: #000;
            border-color: var(--gold-color);
        }

        .spin-btn {
            background: linear-gradient(180deg, #ff453a, #ff3b30);
            border: none;
            color: white;
            padding: 18px;
            border-radius: 16px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 5px 0 #b3241c;
            cursor: pointer;
            transition: all 0.1s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .spin-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b3241c;
        }

        .spin-btn:disabled {
            background: #48484a;
            box-shadow: 0 5px 0 #2c2c2e;
            color: #8e8e93;
            cursor: not-allowed;
        }

        /* 结果显示与数据面板 */
        .msg-display {
            text-align: center;
            height: 30px;
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #30d158;
        }

        .stats-panel {
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            margin-top: 20px;
            box-sizing: border-box;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }

        .stat-box {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 10px;
        }

        .stat-box div:first-child {
            font-size: 0.8rem;
            color: #8e8e93;
            margin-bottom: 5px;
        }

        .stat-box div:last-child {
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🎰 幸运转轮 2.0</h2>
        <div class="balance-container">资产: $<span id="balance">1000</span></div>
    </div>

    <div class="machine-container">
        <div class="marquee">★ JACKPOT ★</div>
        
        <div class="slots-window">
            <!-- 轮盘 1 -->
            <div class="reel" id="reel1">
                <div class="reel-container" id="container1"></div>
            </div>
            <!-- 轮盘 2 -->
            <div class="reel" id="reel2">
                <div class="reel-container" id="container2"></div>
            </div>
            <!-- 轮盘 3 -->
            <div class="reel" id="reel3">
                <div class="reel-container" id="container3"></div>
            </div>
        </div>

        <div class="msg-display" id="msgDisplay">准备好大赢一场了吗？</div>

        <div class="controls">
            <div class="bet-selector">
                <span style="color:#8e8e93;">下注额:</span>
                <button class="bet-btn active" onclick="setBet(10)">10</button>
                <button class="bet-btn" onclick="setBet(50)">50</button>
                <button class="bet-btn" onclick="setBet(100)">100</button>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="startSpin()">拉 动摇 杆 !</button>
        </div>
    </div>

    <!-- 数据分析统计面板 -->
    <div class="stats-panel">
        <div class="stats-grid">
            <div class="stat-box">
                <div>启动次数</div>
                <div id="statPlays">0</div>
            </div>
            <div class="stat-box">
                <div>中奖次数</div>
                <div id="statWins">0</div>
            </div>
            <div class="stat-box">
                <div>综合胜率</div>
                <div id="statRate">0%</div>
            </div>
        </div>
    </div>

    <script>
        // 游戏核心数据配置
        const pool = ['7', '🍒', '🍋', '🍉', '💎', '🍇'];
        let balance = 1000;
        let currentBet = 10;
        let isSpinning = false;

        // 统计指标
        let totalPlays = 0;
        let totalWins = 0;

        // 初始化原生音频上下文（免去加载外部音频）
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // 构建轮盘DOM元素
        function initReels() {
            for (let i = 1; i <= 3; i++) {
                const container = document.getElementById(`container${i}`);
                container.innerHTML = '';
                // 预先生成多组图标形成无缝滚动流
                for (let j = 0; j < 30; j++) {
                    const div = document.createElement('div');
                    div.className = 'slot-icon';
                    div.innerText = pool[j % pool.length];
                    container.appendChild(div);
                }
            }
        }

        function setBet(amount) {
            if (isSpinning) return;
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.innerText) === amount);
            });
            playTone(440, 'sine', 0.05);
        }

        // 核心滚动逻辑
        async function startSpin() {
            if (isSpinning || balance < currentBet) {
                if (balance < currentBet) alert("资金余额不足，请充值或调低赌注！");
                return;
            }

            // 扣除本金
            isSpinning = true;
            balance -= currentBet;
            totalPlays++;
            document.getElementById('balance').innerText = balance;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('msgDisplay').innerText = "滚动中...";
            document.getElementById('msgDisplay').style.color = "#ff9500";

            // 预先计算结果
            const finalResults = [
                pool[Math.floor(Math.random() * pool.length)],
                pool[Math.floor(Math.random() * pool.length)],
                pool[Math.floor(Math.random() * pool.length)]
            ];

            // 启动三个滚轮的异歩滚动动画
            const p1 = spinReel(1, finalResults[0], 1.5);
            const p2 = spinReel(2, finalResults[1], 2.0);
            const p3 = spinReel(3, finalResults[2], 2.5);

            await Promise.all([p1, p2, p3]);

            // 结算奖励
            settleGame(finalResults);
        }

        function spinReel(reelNum, targetIcon, duration) {
            return new Promise(resolve => {
                const container = document.getElementById(`container${reelNum}`);
                
                // 定位目标图标在循环流中的匹配项
                const matchIndex = pool.indexOf(targetIcon);
                // 确保它滚到较为靠后的位置以展示高速效果
                const targetIndex = matchIndex + pool.length * 3; 
                const targetTop = -(targetIndex * 120);

                container.style.transition = `top ${duration}s cubic-bezier(0.25, 0.1, 0.25, 1)`;
                container.style.top = `${targetTop}px`;

                // 滚动中发出的音效
                let interval = setInterval(() => {
                    if (!isSpinning) clearInterval(interval);
                    else playTone(300 + (reelNum * 100), 'triangle', 0.02);
                }, 100);

                setTimeout(() => {
                    clearInterval(interval);
                    playTone(600 + (reelNum * 100), 'sine', 0.1);
                    resolve();
                }, duration * 1000);
            });
        }

        function settleGame(results) {
            isSpinning = false;
            document.getElementById('spinBtn').disabled = false;

            const [r1, r2, r3] = results;
            let winMultiplier = 0;
            let message = "";

            if (r1 === r2 && r2 === r3) {
                // 三连全中 (Jackpot)
                totalWins++;
                if (r1 === '7') {
                    winMultiplier = 50; // 777 爆大奖
                    message = "🔥 究极暴富！777 特等奖！";
                } else if (r1 === '💎') {
                    winMultiplier = 30;
                    message = "💎 闪耀华丽！钻石大奖！";
                } else {
                    winMultiplier = 15;
                    message = `🎉 恭喜！触发三连 ${r1}！`;
                }
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                // 两连中
                totalWins++;
                winMultiplier = 2;
                message = "✨ 运气不错，双星连珠！";
            } else {
                // 未中奖
                message = " 差一点就中了，再接再厉！";
            }

            // 更新金额与界面
            if (winMultiplier > 0) {
                const winAmount = currentBet * winMultiplier;
                balance += winAmount;
                document.getElementById('msgDisplay').innerText = `${message} +$${winAmount}`;
                document.getElementById('msgDisplay').style.color = "#30d158";
                // 连续播放中奖喜报音效
                playTone(523.25, 'square', 0.1);
                setTimeout(() => playTone(659.25, 'square', 0.1), 100);
                setTimeout(() => playTone(783.99, 'square', 0.3), 200);
            } else {
                document.getElementById('msgDisplay').innerText = message;
                document.getElementById('msgDisplay').style.color = "#ff3b30";
                playTone(150, 'sawtooth', 0.2);
            }

            // 更新仪表盘
            document.getElementById('balance').innerText = balance;
            document.getElementById('statPlays').innerText = totalPlays;
            document.getElementById('statWins').innerText = totalWins;
            document.getElementById('statRate').innerText = `${Math.round((totalWins / totalPlays) * 100)}%`;

            // 重置滚轮以便下一次无缝旋转
            for (let i = 1; i <= 3; i++) {
                const container = document.getElementById(`container${i}`);
                const currentMatch = pool.indexOf(results[i-1]);
                container.style.transition = 'none';
                container.style.top = `-${currentMatch * 120}px`;
            }
        }

        // 页面装载自动初始化
        window.onload = initReels;
    </script>
</body>
</html>
