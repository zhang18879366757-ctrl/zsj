<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUANT LABS - Combo Matrix 7.0</title>
    <style>
        :root { --bg: #0b0b0e; --gold: #ffcc00; --primary: #ff3b30; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; box-sizing: border-box; overflow: hidden; }
        
        .dashboard { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; }
        .score-pill { background: #222; padding: 10px 15px; border-radius: 20px; color: var(--gold); border: 1px solid #444; }
        
        .cabinet { width: 100%; max-width: 400px; background: #1a0505; border: 4px solid #500; border-radius: 20px; padding: 15px; box-sizing: border-box; }
        
        /* 5x3 网格布局 */
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(3, 70px); gap: 6px; background: #000; border: 3px solid var(--gold); border-radius: 12px; padding: 8px; position: relative; }
        .cell { background: #111; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 2.2rem; transition: transform 0.3s ease, opacity 0.3s ease; }
        
        /* 消除动画特效 */
        .pop { transform: scale(0); opacity: 0; }
        .fall { transform: translateY(-70px); animation: drop 0.4s forwards; }
        @keyframes drop { to { transform: translateY(0); } }

        .led { background: #000; color: #30d158; padding: 12px; margin: 15px 0; border-radius: 8px; font-weight: bold; text-align: center; border: 1px solid #333; }
        .spin-btn { width: 100%; padding: 18px; background: var(--primary); border: none; color: #fff; border-radius: 12px; font-size: 1.4rem; font-weight: 900; cursor: pointer; transition: 0.1s; }
        .spin-btn:active { transform: scale(0.96); }
        .spin-btn:disabled { background: #555; color: #888; }
        
        .debug-area { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; margin-top: 15px; }
        .debug-btn { background: #222; padding: 12px; text-align: center; border-radius: 8px; font-size: 0.8rem; color: #666; cursor: pointer; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div>QUANT LABS 7.0</div>
        <div class="score-pill">总资产: $<span id="domScore">1000</span></div>
    </div>

    <div class="cabinet">
        <div class="grid" id="grid">
            </div>
        <div class="led" id="led">🎯 矩阵待机中</div>
        <button class="spin-btn" id="spinBtn" onclick="startGame()">充能 SPIN</button>
    </div>

    <div class="debug-area">
        <div class="debug-btn" onclick="seq(1)">周期 [1]</div>
        <div class="debug-btn" onclick="debug-btn" onclick="seq(2)">投入 [2]</div>
        <div class="debug-btn" onclick="seq(3)">返还 [3]</div>
    </div>

    <script>
        const symbols = ['💎', '🍒', '🍋', '🔔', '🍇']; // 移除7，将7作为暗门专属
        const COLS = 5;
        const ROWS = 3;
        let board = [];
        let domCells = [];
        let score = 1000;
        let isProcessing = false;

        // 暗门逻辑
        let _seq = [], _jackpot = false;
        function seq(n) {
            _seq.push(n);
            if (_seq.length > 3) _seq.shift();
            if (_seq.join(',') === '1,2,3') {
                _jackpot = true;
                const led = document.getElementById('led');
                led.innerText = "⚡️ 战术核显卡已超频 (全屏777)";
                led.style.color = "#ffcc00";
            }
        }

        // 延迟辅助函数
        const delay = ms => new Promise(r => setTimeout(r, ms));

        // 初始化网格
        function initGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            board = [];
            domCells = [];
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                domCells[r] = [];
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    // 初始随机填充（确保初始无消除）
                    let sym = symbols[Math.floor(Math.random() * symbols.length)];
                    board[r][c] = sym;
                    cell.innerText = sym;
                    domCells[r][c] = cell;
                    gridEl.appendChild(cell);
                }
            }
        }

        async function startGame() {
            if (isProcessing) return;
            isProcessing = true;
            document.getElementById('spinBtn').disabled = true;
            score -= 10; // 每次消耗10
            updateScore();
            document.getElementById('led').innerText = "🔄 矩阵重组中...";
            document.getElementById('led').style.color = "#30d158";

            // 1. 生成新盘面
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    domCells[r][c].classList.add('pop'); // 收缩动画
                }
            }
            await delay(300);

            // 暗门判定：如果激活，全屏填充 '7'
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let sym = _jackpot ? '7' : symbols[Math.floor(Math.random() * symbols.length)];
                    board[r][c] = sym;
                    domCells[r][c].innerText = sym;
                    domCells[r][c].classList.remove('pop');
                }
            }
            _jackpot = false; // 用完即抛
            await delay(300);

            // 2. 启动连击检测引擎
            await processMatches(1);
        }

        // 核心递归算法：检测 -> 消除 -> 下落 -> 补充 -> 再次检测
        async function processMatches(comboCount) {
            let matchedCoords = new Set();

            // 横向检测
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS - 2; c++) {
                    let sym = board[r][c];
                    if (sym && sym === board[r][c+1] && sym === board[r][c+2]) {
                        matchedCoords.add(`${r},${c}`);
                        matchedCoords.add(`${r},${c+1}`);
                        matchedCoords.add(`${r},${c+2}`);
                    }
                }
            }
            // 纵向检测
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r < ROWS - 2; r++) {
                    let sym = board[r][c];
                    if (sym && sym === board[r+1][c] && sym === board[r+2][c]) {
                        matchedCoords.add(`${r},${c}`);
                        matchedCoords.add(`${r+1},${c}`);
                        matchedCoords.add(`${r+2},${c}`);
                    }
                }
            }

            // 如果没有匹配，本轮结束
            if (matchedCoords.size === 0) {
                document.getElementById('spinBtn').disabled = false;
                isProcessing = false;
                if(comboCount === 1) document.getElementById('led').innerText = "结算完成，未触发消除。";
                return;
            }

            // 执行消除
            document.getElementById('led').innerText = `💥 Combo x${comboCount}! 消除 ${matchedCoords.size} 个单位`;
            document.getElementById('led').style.color = comboCount > 1 ? "#ffcc00" : "#30d158";
            
            // 计算得分：消除数量 * 连击数 * 5
            score += matchedCoords.size * comboCount * 5;
            updateScore();

            matchedCoords.forEach(coord => {
                let [r, c] = coord.split(',').map(Number);
                domCells[r][c].classList.add('pop');
                board[r][c] = null;
            });
            await delay(400);

            // 执行重力下落
            for (let c = 0; c < COLS; c++) {
                let emptySpaces = 0;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r][c] === null) {
                        emptySpaces++;
                    } else if (emptySpaces > 0) {
                        // 元素下移
                        board[r + emptySpaces][c] = board[r][c];
                        board[r][c] = null;
                        
                        domCells[r + emptySpaces][c].innerText = board[r + emptySpaces][c];
                        domCells[r + emptySpaces][c].classList.remove('pop');
                        domCells[r][c].classList.add('pop');
                    }
                }
            }
            await delay(200);

            // 顶部填充新元素
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] === null) {
                        let newSym = symbols[Math.floor(Math.random() * symbols.length)];
                        board[r][c] = newSym;
                        domCells[r][c].innerText = newSym;
                        domCells[r][c].classList.remove('pop');
                        domCells[r][c].classList.add('fall');
                    }
                }
            }
            await delay(400);

            // 清理下落动画类
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    domCells[r][c].classList.remove('fall');
                }
            }

            // 递归调用，检测掉落后是否形成新的连击
            await processMatches(comboCount + 1);
        }

        function updateScore() {
            document.getElementById('domScore').innerText = score;
        }

        // 启动初始化
        initGrid();
    </script>
</body>
</html>
