<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SLOT V4</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.container{
    width:95%;
    max-width:420px;
}
.title{
    text-align:center;
    font-size:2rem;
    margin-bottom:15px;
}
.balance{
    text-align:center;
    background:#111;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}
.reels{
    display:flex;
    gap:8px;
    background:#222;
    padding:10px;
    border-radius:12px;
}
.reel{
    flex:1;
    height:120px;
    background:#fff;
    color:#000;
    border-radius:8px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:3rem;
    font-weight:bold;
}
.led{
    margin-top:15px;
    background:#111;
    color:#0f0;
    text-align:center;
    padding:15px;
    border-radius:8px;
    min-height:60px;
    font-weight:bold;
}
.bet-panel{
    display:flex;
    gap:10px;
    margin-top:15px;
}
.bet-panel button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#333;
    color:white;
}
.spin{
    width:100%;
    margin-top:15px;
    padding:18px;
    font-size:1.4rem;
    font-weight:bold;
    border:none;
    border-radius:12px;
    background:#e60000;
    color:white;
}
.win{
    animation:flash .4s infinite;
}
@keyframes flash{
    0%{transform:scale(1)}
    50%{transform:scale(1.08)}
    100%{transform:scale(1)}
}
.footer{
    margin-top:15px;
    text-align:center;
    color:#888;
    font-size:12px;
}
</style>
</head>
<body>
<div class="container">
<div class="title">🎰 SLOT V4</div>
<div class="balance">
余额：<span id="balance">1000</span>
</div>
<div class="reels">
<div class="reel" id="r1">🍒</div>
<div class="reel" id="r2">🍋</div>
<div class="reel" id="r3">🍇</div>
</div>
<div class="led" id="led">
点击 SPIN 开始游戏
</div>
<div class="bet-panel">
<button onclick="setBet(10)">下注10</button>
<button onclick="setBet(50)">下注50</button>
<button onclick="setBet(100)">下注100</button>
</div>
<button class="spin" id="spinBtn" onclick="spin()">
SPIN
</button>
<div class="footer">
当前下注：<span id="bet">10</span>
</div>
</div>
<script>
const symbols=[
'7',
'💎',
'🍒',
'🍋',
'🍇',
'🍉',
'🔔'
];
let balance=1000;
let bet=10;
let spinning=false;
function setBet(v){
    bet=v;
    document.getElementById("bet").innerText=v;
}
function rand(){
    return symbols[
        Math.floor(
            Math.random()*symbols.length
        )
    ];
}
function updateBalance(){
    document.getElementById("balance").innerText=balance;
}
async function animateReel(id,time){
    return new Promise(resolve=>{
        const el=document.getElementById(id);
        const timer=setInterval(()=>{
            el.innerText=rand();
        },60);
        setTimeout(()=>{
            clearInterval(timer);
            const result=rand();
            el.innerText=result;
            resolve(result);
        },time);
    });
}
async function spin(){
    if(spinning) return;
    if(balance<bet){
        led.innerText="余额不足";
        return;
    }
    spinning=true;
    balance-=bet;
    updateBalance();
    led.innerText="旋转中...";
    spinBtn.disabled=true;
    const a=await animateReel("r1",1000);
    const b=await animateReel("r2",1400);
    const c=await animateReel("r3",1800);
    judge(a,b,c);
    spinBtn.disabled=false;
    spinning=false;
}
function judge(a,b,c){
    const led=document.getElementById("led");
    document
        .querySelector(".reels")
        .classList.remove("win");
    if(a==="7"&&b==="7"&&c==="7"){
        const win=bet*50;
        balance+=win;
        updateBalance();
        led.innerText=
        "🌋 JACKPOT +"+win;
        document
            .querySelector(".reels")
            .classList.add("win");
        return;
    }
    if(a===b&&b===c){
        const win=bet*10;
        balance+=win;
        updateBalance();
        led.innerText=
        "🎉 三连中奖 +"+win;
        document
            .querySelector(".reels")
            .classList.add("win");
        return;
    }
    if(a===b||b===c||a===c){
        const win=bet*2;
        balance+=win;
        updateBalance();
        led.innerText=
        "✨ 小奖 +"+win;
        return;
    }
    led.innerText="😢 未中奖";
}
</script>
</body>
</html>
