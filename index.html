<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot v6.3 Stable 🎰</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
    background: linear-gradient(135deg,#0b1220,#05070d);
    color:#fff;
}

/* 主容器（纯稳样式） */
.box{
    width:360px;
    padding:20px;
    border-radius:18px;
    background:#101826;
    border:1px solid #1f3b4d;
    box-shadow:0 0 25px rgba(0,255,255,0.08);
    text-align:center;
}

h1{
    margin:0 0 10px;
    color:#00ffe1;
}

/* HUD */
.hud{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:10px;
    opacity:0.9;
}

/* 机位按钮（稳定版无复杂动画） */
.machines{
    display:flex;
    gap:6px;
    margin-bottom:10px;
}

.machines button{
    flex:1;
    padding:6px;
    font-size:12px;
    border:none;
    background:#1b2a3a;
    color:#9ff;
    border-radius:8px;
    cursor:pointer;
}

.machines button.active{
    background:#00ffe1;
    color:#001018;
}

/* 老虎机区域 */
.stage{
    background:#0c141f;
    border:1px solid #1f3b4d;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
}

.reels{
    display:flex;
    justify-content:space-between;
}

.reel{
    width:90px;
    height:90px;
    background:#0a0f18;
    border:1px solid #1f3b4d;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
}

/* 按钮 */
button.spin{
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#00ffe1;
    color:#001018;
    font-weight:bold;
    cursor:pointer;
}

#msg{
    margin-top:10px;
    font-size:13px;
    opacity:0.9;
}
</style>
</head>

<body>

<div class="box">
    <h1>🎰 SLOT v6.3</h1>

    <div class="hud">
        <div>💰 <span id="bal">100</span></div>
        <div>🎲 <span id="bet">10</span></div>
    </div>

    <div class="machines">
        <button data-m="classic" class="active">Classic</button>
        <button data-m="jackpot">Jackpot</button>
        <button data-m="ultra">Ultra</button>
    </div>

    <div class="stage">
        <div class="reels">
            <div class="reel" id="r1">🍒</div>
            <div class="reel" id="r2">🍋</div>
            <div class="reel" id="r3">🍊</div>
        </div>
    </div>

    <button class="spin">SPIN</button>
    <div id="msg">Ready</div>
</div>

<script>
// =====================
// 状态
// =====================
let bal = 100;
let spinning = false;
let current = "classic";

// =====================
// 机位配置
// =====================
const M = {
 classic:{bet:10,p:[["🍒",40],["🍋",30],["🍊",20],["⭐",10]]},
 jackpot:{bet:20,p:[["🍒",30],["⭐",40],["💎",30]]},
 ultra:{bet:50,p:[["⭐",50],["💎",30],["🔥",20]]}
};

// =====================
// DOM
// =====================
const balEl = document.getElementById("bal");
const betEl = document.getElementById("bet");
const msgEl = document.getElementById("msg");
const reels = [
 document.getElementById("r1"),
 document.getElementById("r2"),
 document.getElementById("r3")
];

// =====================
// 权重随机
// =====================
function pick(list){
 let total = 0;
 for(let i=0;i<list.length;i++) total += list[i][1];

 let r = Math.random() * total;

 for(let i=0;i<list.length;i++){
  r -= list[i][1];
  if(r<=0) return list[i][0];
 }
}

// =====================
// RAF 滚轮（稳定核心）
// =====================
function roll(el, final){
 return new Promise(resolve=>{
  let frames = 0;
  let speed = 0;

  function step(){
    frames++;

    if(frames < 20){
      el.textContent = randomSymbol();
      requestAnimationFrame(step);
    } else {
      speed++;
      if(speed < 10){
        el.textContent = randomSymbol();
        requestAnimationFrame(step);
      } else {
        el.textContent = final;
        resolve();
      }
    }
  }

  step();
 });
}

// =====================
function randomSymbol(){
 const arr = ["🍒","🍋","🍊","🍉","⭐","💎","🔥"];
 return arr[Math.floor(Math.random()*arr.length)];
}

// =====================
// 机位切换（稳定版事件绑定）
// =====================
document.querySelectorAll(".machines button").forEach(btn=>{
 btn.addEventListener("click",()=>{
  document.querySelectorAll(".machines button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");

  current = btn.dataset.m;
  betEl.textContent = M[current].bet;
  msgEl.textContent = "Switched: " + current;
 });
});

// =====================
// spin
// =====================
async function spin(){
 if(spinning) return;

 const m = M[current];

 if(bal < m.bet){
  msgEl.textContent = "Not enough balance";
  return;
 }

 spinning = true;
 bal -= m.bet;
 balEl.textContent = bal;

 msgEl.textContent = "Spinning...";

 const a = pick(m.p);
 const b = pick(m.p);
 const c = pick(m.p);

 await Promise.all([
  roll(reels[0], a),
  roll(reels[1], b),
  roll(reels[2], c)
 ]);

 const win = (a===b && b===c);

 if(win){
  const reward = m.bet * 5;
  bal += reward;
  balEl.textContent = bal;
  msgEl.textContent = "WIN +" + reward;
 } else {
  msgEl.textContent = "Try again";
 }

 spinning = false;
}

// =====================
// 绑定按钮（无 inline event）
// =====================
document.querySelector(".spin").addEventListener("click",spin);

</script>

</body>
</html>
